<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Open WiFiGate</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- ✅ Open Graph tags for WhatsApp / Telegram / Facebook previews -->
  <meta property="og:title" content="WiFiGate Access" />
  <meta property="og:description" content="Tap to open your gate securely with WiFiGate." />
  <meta property="og:image" content="https://www.eats-systems.com/images/systems/wifigate.png" />
  <meta property="og:url" content="https://www.eats-systems.com/wifigate-link/" />
  <meta property="og:type" content="website" />

  <!-- (Optional but nice) Twitter preview -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WiFiGate Access" />
  <meta name="twitter:description" content="Tap to open your gate securely with WiFiGate." />
  <meta name="twitter:image" content="https://www.eats-systems.com/images/systems/wifigate.png" />

  <script>
    // Get query string parameters as an object
    function getQueryParams() {
      const qs = location.search.replace(/^\?/, "");
      const parts = qs ? qs.split("&") : [];
      const out = {};
      parts.forEach((p) => {
        const [k, v] = p.split("=");
        if (!k) return;
        out[decodeURIComponent(k)] = v ? decodeURIComponent(v) : "";
      });
      return out;
    }

    (function () {
      // Directly use plain query parameters (no Base64)
      const data = getQueryParams();

      // ✅ Support new "id only" format (no chip in URL)
      const id = data.id || "";
      const chip = data.chip || id; // fall back to id if chip is missing

      const deep =
        `wifigate://gate/${encodeURIComponent(id)}?` +
        `chip=${encodeURIComponent(chip || "")}` +
        `&name=${encodeURIComponent(data.name || "")}` +
        `&version=${encodeURIComponent(data.version || "-")}` +
        `&subscription=${encodeURIComponent(data.subscription || "-")}` +
        `&created=${encodeURIComponent(data.created || Date.now())}` +
        (data.role ? `&role=${encodeURIComponent(data.role)}` : "") +
        (data.isGuest ? `&isGuest=${encodeURIComponent(data.isGuest)}` : "") +
        (data.hostPhone
          ? `&hostPhone=${encodeURIComponent(data.hostPhone)}`
          : "") +
        (data.guestPhone
          ? `&guestPhone=${encodeURIComponent(data.guestPhone)}`
          : "") +
        (data.accessDate
          ? `&accessDate=${encodeURIComponent(data.accessDate)}`
          : "") +
        (data.accessStart
          ? `&accessStart=${encodeURIComponent(data.accessStart)}`
          : "") +
        (data.accessEnd
          ? `&accessEnd=${encodeURIComponent(data.accessEnd)}`
          : "");

      console.log("🔗 Redirecting to:", deep);

      // Redirect to the app after a short delay
      setTimeout(() => (window.location.href = deep), 200);

      // Fallback message if the app does not open
      document.addEventListener("DOMContentLoaded", () => {
        const el = document.getElementById("info");
        el.innerHTML = `
          <p>Opening WiFiGate…</p>
          <p>If nothing happens, <a href="${deep}">open manually</a>.</p>
        `;
      });
    })();
  </script>
</head>

<body>
  <div id="info" style="
        font-family: system-ui, Arial;
        max-width: 720px;
        margin: 48px auto;
        text-align: center;
      ">
    <p>Opening WiFiGate…</p>
  </div>
</body>

</html>
