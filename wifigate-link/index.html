<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Open WiFiGate</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- ✅ Open Graph tags for WhatsApp / Telegram / Facebook previews -->
  <meta property="og:title" content="WiFiGate Access" />
  <meta property="og:description" content="Tap to open your gate securely with WiFiGate." />
  <meta property="og:image" content="https://www.eats-systems.com/images/systems/wifigate.png" />
  <meta property="og:url" content="https://www.eats-systems.com/wifigate-link/" />
  <meta property="og:type" content="website" />

  <!-- (Optional but nice) Twitter preview -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WiFiGate Access" />
  <meta name="twitter:description" content="Tap to open your gate securely with WiFiGate." />
  <meta name="twitter:image" content="https://www.eats-systems.com/images/systems/wifigate.png" />

  <script>
    // Get query string parameters as an object
    function getQueryParams() {
      const qs = location.search.replace(/^\?/, "");
      const parts = qs ? qs.split("&") : [];
      const out = {};
      parts.forEach((p) => {
        const [k, v] = p.split("=");
        if (!k) return;
        out[decodeURIComponent(k)] = v ? decodeURIComponent(v) : "";
      });
      return out;
    }

    (function () {
      // Read all raw query params (short + verbose)
      const data = getQueryParams();

      /**
       * We support two URL formats:
       *
       * 1) New SHORT params (for shorter WhatsApp links):
       *    - i   → gate id / system id
       *    - g   → guest flag ("1" | "0")
       *    - r   → role code ("A" | "U" | "G" | "PU" | "PA")
       *    - h   → host phone
       *    - p   → guest phone
       *    - sd  → access date (YYYY-MM-DD)
       *    - ss  → access start (ms since epoch)
       *    - se  → access end   (ms since epoch)
       *
       * 2) Old VERBOSE params (backwards compatible):
       *    - id, chip, name, version, subscription, created
       *    - isGuest, kind, role, hostPhone, guestPhone
       *    - accessDate, accessStart, accessEnd
       *
       * Here we *normalize* everything to the verbose names when
       * building the deep link, so the mobile app can keep using
       * the existing parseIncomingLink logic.
       */

      // Identifier: prefer short "i", fallback to old "id"
      const id = data.i || data.id || "";
      // chip param: if not present, we reuse the id as systemId
      const chip = data.chip || id;

      // Name / version / subscription / created: verbose-only for now
      const name = data.name || "";
      const version = data.version || "-";
      const subscription = data.subscription || "-";
      const created = data.created || Date.now();

      // Guest flag:
      //  - short form "g" = "1" | "0"
      //  - old form "isGuest" = "true" | "false"
      const rawGuestFlag = data.g != null ? data.g : data.isGuest;
      const isGuest =
        rawGuestFlag === "1" ||
        rawGuestFlag === "true" ||
        rawGuestFlag === true;

      // Role:
      //  - short "r" uses compact codes:
      //        "A"  → "ADMIN"
      //        "U"  → "USER"
      //        "G"  → "GUEST"
      //        "PU" → "PRE_USER"
      //        "PA" → "PRE_ADMIN"
      //  - old "role" is already the full string.
      let role = "";
      if (data.r) {
        switch (data.r) {
          case "A":
            role = "ADMIN";
            break;
          case "U":
            role = "USER";
            break;
          case "G":
            role = "GUEST";
            break;
          case "PU":
            role = "PRE_USER";
            break;
          case "PA":
            role = "PRE_ADMIN";
            break;
          default:
            // If it's an unknown short code, just pass as-is.
            role = data.r;
        }
      } else if (data.role) {
        role = data.role;
      }

      // Phones: short "h"/"p" or verbose hostPhone/guestPhone
      const hostPhone = data.h || data.hostPhone || "";
      const guestPhone = data.p || data.guestPhone || "";

      // Access window: short "sd"/"ss"/"se" or verbose accessDate/accessStart/accessEnd
      const accessDate = data.sd || data.accessDate || "";
      const accessStart = data.ss || data.accessStart || "";
      const accessEnd = data.se || data.accessEnd || "";

      // Optional "kind" (kept as-is if provided)
      const kind = data.kind || "";

      // Build the deep link query string using the verbose keys
      const deepBase = `wifigate://gate/${encodeURIComponent(id)}`;
      let deepQuery = "";

      function addParam(key, value) {
        if (value === undefined || value === null || value === "") return;
        deepQuery +=
          (deepQuery ? "&" : "") +
          encodeURIComponent(key) +
          "=" +
          encodeURIComponent(String(value));
      }

      addParam("chip", chip);
      addParam("name", name);
      addParam("version", version);
      addParam("subscription", subscription);
      addParam("created", created);

      if (role) {
        addParam("role", role);
      }
      if (kind) {
        addParam("kind", kind);
      }
      if (isGuest) {
        addParam("isGuest", "true");
      }

      addParam("hostPhone", hostPhone);
      addParam("guestPhone", guestPhone);

      addParam("accessDate", accessDate);
      addParam("accessStart", accessStart);
      addParam("accessEnd", accessEnd);

      const deep = deepBase + (deepQuery ? `?${deepQuery}` : "");

      console.log("🔗 Redirecting to:", deep);

      // Redirect to the app after a short delay
      setTimeout(() => {
        window.location.href = deep;
      }, 200);

      // Fallback message if the app does not open
      document.addEventListener("DOMContentLoaded", () => {
        const el = document.getElementById("info");
        el.innerHTML = `
            <p>Opening WiFiGate\u2026</p>
            <p>If nothing happens, <a href="${deep}">open manually</a>.</p>
          `;
      });
    })();
  </script>
</head>

<body>
  <div id="info" style="
        font-family: system-ui, Arial;
        max-width: 720px;
        margin: 48px auto;
        text-align: center;
      ">
    <p>Opening WiFiGate…</p>
  </div>
</body>

</html>
